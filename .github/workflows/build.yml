name: Build APK

# Builds ClearCut when started by hand (Actions → Build APK → Run workflow),
# and publishes a GitHub release when a tag like v2.3.7 is pushed. It doesn't
# run on every push: a build takes ~25 minutes, and private repos get a limited
# number of free Actions minutes each month.
# Release APKs are signed only when the signing secrets below are set; without
# them the workflow builds a debug APK instead.
#
# Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of clearcut-release.jks
#   KEYSTORE_PASSWORD  store password (also used as the key password)
#   KEY_ALIAS          clearcut

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The proprietary Discord SDK isn't in the repo.
      ZANGETSU_NO_DISCORD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/release.jks"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APKs (signed)
        if: steps.signing.outputs.signed == 'true'
        run: flutter build apk --release --split-per-abi

      # Twice during development a failed Kotlin build left corrupt Gradle
      # intermediates and produced APKs with NO libapp.so (the whole Dart AOT
      # snapshot). They installed fine and crashed on launch. Never publish
      # one: check the native libs on the actual artifacts, not the build log.
      - name: Verify native libraries in release APKs
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "Checking $apk"
            unzip -l "$apk" | grep -q 'libapp.so' || {
              echo "::error::libapp.so missing from $apk - refusing to publish"
              exit 1
            }
            for lib in libflutter.so libmpv.so libadblock-client.so; do
              unzip -l "$apk" | grep -q "$lib" || {
                echo "::error::$lib missing from $apk - refusing to publish"
                exit 1
              }
            done
          done

      - name: Build debug APK (no signing secrets)
        if: steps.signing.outputs.signed != 'true'
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: clearcut-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
          generate_release_notes: true
